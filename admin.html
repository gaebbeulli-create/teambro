<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 | TEAM BRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#fff;min-height:100vh}
        .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .login-box{background:#16161f;border:2px solid #252530;border-radius:20px;padding:40px;width:100%;max-width:360px;text-align:center}
        .login-box h1{color:#2dd4bf;font-size:1.8rem;margin-bottom:8px}
        .login-box p{color:#808090;margin-bottom:24px}
        .login-box input{width:100%;padding:14px;background:#0a0a0f;border:2px solid #252530;border-radius:10px;color:#fff;font-size:1rem;margin-bottom:12px}
        .login-box input:focus{outline:none;border-color:#2dd4bf}
        .login-box button{width:100%;padding:14px;background:#2dd4bf;border:none;border-radius:10px;color:#000;font-size:1rem;font-weight:bold;cursor:pointer}
        .login-box button:hover{background:#5eead4}
        .error{color:#ef4444;margin-top:12px;font-size:.9rem}
        
        .dashboard{display:none}
        .header{background:#16161f;padding:16px 20px;border-bottom:1px solid #252530;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
        .header h2{color:#2dd4bf;font-size:1.3rem}
        .header-right{display:flex;gap:10px;align-items:center}
        .header-user{color:#808090;font-size:.9rem}
        .header button{padding:10px 20px;background:#252530;border:none;border-radius:8px;color:#fff;cursor:pointer}
        .header button:hover{background:#ef4444}
        
        .tabs{display:flex;gap:8px;padding:20px;flex-wrap:wrap}
        .tabs button{padding:12px 20px;background:#16161f;border:2px solid #252530;border-radius:10px;color:#808090;cursor:pointer;font-size:.9rem}
        .tabs button:hover{border-color:#2dd4bf}
        .tabs button.active{background:#2dd4bf;border-color:#2dd4bf;color:#000}
        
        .content{padding:0 20px 40px}
        .panel{display:none}
        .panel.active{display:block}
        
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
        .stat{background:#16161f;border:2px solid #252530;border-radius:12px;padding:20px;text-align:center}
        .stat span{display:block;font-size:2rem;color:#2dd4bf;font-weight:bold}
        .stat small{color:#808090}
        
        .table-box{background:#16161f;border:2px solid #252530;border-radius:12px;overflow:hidden;margin-bottom:20px}
        .table-head{padding:16px;border-bottom:1px solid #252530;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
        .table-head h3{font-size:1rem}
        .filters{display:flex;gap:6px;flex-wrap:wrap}
        .filters button{padding:6px 12px;background:#0a0a0f;border:1px solid #252530;border-radius:6px;color:#808090;font-size:.8rem;cursor:pointer}
        .filters button:hover,.filters button.active{border-color:#2dd4bf;color:#2dd4bf}
        
        .table-wrap{overflow-x:auto}
        table{width:100%;border-collapse:collapse;min-width:500px}
        th,td{padding:12px 16px;text-align:left;border-bottom:1px solid #252530}
        th{background:#0a0a0f;color:#808090;font-size:.85rem}
        tr:hover{background:#0a0a0f}
        
        .badge{padding:4px 10px;border-radius:20px;font-size:.75rem}
        .badge.new{background:rgba(34,197,94,.2);color:#22c55e}
        .badge.progress{background:rgba(249,115,22,.2);color:#f97316}
        .badge.done{background:rgba(45,212,191,.2);color:#2dd4bf}
        .badge.partner{background:rgba(45,212,191,.2);color:#2dd4bf}
        .badge.rider{background:rgba(249,115,22,.2);color:#f97316}
        .badge.settlement{background:rgba(167,139,250,.2);color:#a78bfa}
        .badge.master{background:rgba(239,68,68,.2);color:#ef4444}
        .badge.admin{background:rgba(45,212,191,.2);color:#2dd4bf}
        
        .btn{padding:6px 10px;border-radius:6px;border:none;font-size:.8rem;cursor:pointer;margin-right:4px}
        .btn-view{background:#2dd4bf;color:#000}
        .btn-del{background:#ef4444;color:#fff}
        
        .form-box{background:#16161f;border:2px solid #252530;border-radius:12px;padding:20px;margin-bottom:20px}
        .form-box h3{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #252530;font-size:1rem}
        .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
        .form-group{margin-bottom:12px}
        .form-group label{display:block;margin-bottom:6px;color:#b0b0c0;font-size:.85rem}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:#0a0a0f;border:2px solid #252530;border-radius:8px;color:#fff;font-size:.9rem}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#2dd4bf}
        .form-group textarea{min-height:80px;resize:vertical}
        .form-btn{padding:12px 24px;background:#2dd4bf;border:none;border-radius:8px;color:#000;font-weight:bold;cursor:pointer;margin-top:12px}
        
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
        .modal.show{display:flex}
        .modal-box{background:#16161f;border:2px solid #252530;border-radius:16px;width:100%;max-width:500px;max-height:80vh;overflow-y:auto}
        .modal-head{padding:16px 20px;border-bottom:1px solid #252530;display:flex;justify-content:space-between;align-items:center}
        .modal-head h3{font-size:1rem}
        .modal-close{width:32px;height:32px;background:#252530;border:none;border-radius:6px;color:#fff;font-size:1.2rem;cursor:pointer}
        .modal-close:hover{background:#ef4444}
        .modal-body{padding:20px}
        .detail-row{display:flex;padding:10px 0;border-bottom:1px solid #252530}
        .detail-row span:first-child{width:100px;color:#808090;font-size:.85rem}
        .detail-row span:last-child{flex:1;color:#fff}
        .status-sel{padding:8px 12px;background:#0a0a0f;border:2px solid #252530;border-radius:6px;color:#fff}
        
        .toast{position:fixed;bottom:20px;right:20px;padding:14px 20px;border-radius:10px;color:#fff;font-size:.9rem;transform:translateY(100px);opacity:0;transition:.3s;z-index:9999}
        .toast.show{transform:translateY(0);opacity:1}
        .toast.success{background:#22c55e}
        .toast.error{background:#ef4444}
        
        .empty{text-align:center;padding:40px;color:#808090}
        .empty span{font-size:2.5rem;display:block;margin-bottom:10px}
        
        .upload-box{background:#0a0a0f;border:2px dashed #252530;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .3s;position:relative}
        .upload-box:hover{border-color:#2dd4bf}
        .upload-box.dragover{border-color:#2dd4bf;background:rgba(45,212,191,.1)}
        .upload-preview{padding:20px}
        .upload-icon{font-size:3rem;display:block;margin-bottom:10px}
        .upload-preview p{color:#808090;margin-bottom:4px}
        .upload-preview small{color:#606070;font-size:.8rem}
        .remove-img{position:absolute;top:10px;right:10px;background:#ef4444;border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem}
        .remove-img:hover{background:#dc2626}
        .thumb-img{width:60px;height:40px;object-fit:cover;border-radius:6px;background:#252530}
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    
    <div class="login-wrap" id="loginWrap">
        <div class="login-box">
            <h1>TEAM BRO</h1>
            <p>관리자 로그인</p>
            <input type="text" id="adminId" placeholder="아이디">
            <input type="password" id="adminPw" placeholder="비밀번호">
            <button id="loginBtn">로그인</button>
            <div class="error" id="loginError"></div>
        </div>
    </div>
    
    <div class="dashboard" id="dashboard">
        <div class="header">
            <h2>TEAM BRO 관리자</h2>
            <div class="header-right">
                <span class="header-user" id="currentUser"></span>
                <button id="logoutBtn">로그아웃</button>
            </div>
        </div>
        
        <div class="tabs">
            <button class="active" data-tab="submissions">📋 신청관리</button>
            <button data-tab="popups">🎉 팝업</button>
            <button data-tab="notice">📢 공지</button>
            <button data-tab="admins">👤 관리자</button>
            <button data-tab="settings">⚙️ 설정</button>
        </div>
        
        <div class="content">
            <!-- 신청관리 -->
            <div class="panel active" id="submissionsPanel">
                <div class="stats">
                    <div class="stat"><span id="sTotal">0</span><small>전체</small></div>
                    <div class="stat"><span id="sNew">0</span><small>신규</small></div>
                    <div class="stat"><span id="sProgress">0</span><small>진행중</small></div>
                    <div class="stat"><span id="sDone">0</span><small>완료</small></div>
                </div>
                <div class="table-box">
                    <div class="table-head">
                        <h3>신청 목록</h3>
                        <div class="filters">
                            <button class="active" data-filter="all">전체</button>
                            <button data-filter="협력사 신청">협력사</button>
                            <button data-filter="라이더 신청">라이더</button>
                            <button data-filter="선정산 신청">선정산</button>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>유형</th><th>이름</th><th>연락처</th><th>상태</th><th>날짜</th><th>관리</th></tr></thead>
                            <tbody id="subTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 팝업 -->
            <div class="panel" id="popupsPanel">
                <div class="form-box">
                    <h3>새 팝업 추가</h3>
                    <div class="form-grid">
                        <div class="form-group"><label>제목 *</label><input type="text" id="pTitle"></div>
                        <div class="form-group"><label>아이콘</label><input type="text" id="pIcon" placeholder="📢"></div>
                    </div>
                    <div class="form-group">
                        <label>이미지 업로드</label>
                        <div class="upload-box" id="uploadBox">
                            <input type="file" id="pImageFile" accept="image/*" style="display:none">
                            <div class="upload-preview" id="uploadPreview">
                                <span class="upload-icon">📷</span>
                                <p>클릭하여 이미지 선택</p>
                                <small>JPG, PNG, GIF (최대 5MB)</small>
                            </div>
                            <img id="previewImg" style="display:none;max-width:100%;max-height:200px;border-radius:8px;">
                            <button type="button" class="remove-img" id="removeImg" style="display:none">✕ 이미지 삭제</button>
                        </div>
                        <input type="hidden" id="pImg">
                    </div>
                    <div class="form-grid">
                        <div class="form-group"><label>버튼 텍스트</label><input type="text" id="pBtnTxt" placeholder="자세히보기"></div>
                        <div class="form-group"><label>버튼 링크</label><input type="text" id="pBtnLink" placeholder="#contact"></div>
                        <div class="form-group"><label>활성화</label><select id="pActive"><option value="true">활성</option><option value="false">비활성</option></select></div>
                    </div>
                    <div class="form-group"><label>설명</label><textarea id="pDesc"></textarea></div>
                    <button class="form-btn" id="savePopupBtn">팝업 추가</button>
                </div>
                <div class="table-box">
                    <div class="table-head"><h3>팝업 목록</h3></div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>미리보기</th><th>제목</th><th>상태</th><th>관리</th></tr></thead>
                            <tbody id="popupTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 공지 -->
            <div class="panel" id="noticePanel">
                <div class="form-box">
                    <h3>공지 배너 설정</h3>
                    <div class="form-group"><label>공지 내용</label><input type="text" id="nText"></div>
                    <div class="form-grid">
                        <div class="form-group"><label>배너 색상</label><select id="nColor"><option value="mint">민트</option><option value="orange">오렌지</option><option value="red">빨강</option></select></div>
                        <div class="form-group"><label>표시 여부</label><select id="nShow"><option value="true">표시</option><option value="false">숨김</option></select></div>
                    </div>
                    <button class="form-btn" id="saveNoticeBtn">저장</button>
                </div>
            </div>
            
            <!-- 관리자 -->
            <div class="panel" id="adminsPanel">
                <div class="form-box" id="addAdminBox">
                    <h3>관리자 추가</h3>
                    <div class="form-grid">
                        <div class="form-group"><label>아이디 *</label><input type="text" id="newAdminId"></div>
                        <div class="form-group"><label>비밀번호 *</label><input type="password" id="newAdminPw"></div>
                        <div class="form-group"><label>이름</label><input type="text" id="newAdminName"></div>
                        <div class="form-group"><label>등급</label><select id="newAdminRole"><option value="admin">관리자</option><option value="master">마스터</option></select></div>
                    </div>
                    <button class="form-btn" id="addAdminBtn">관리자 추가</button>
                </div>
                <div class="table-box">
                    <div class="table-head"><h3>관리자 목록</h3></div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>아이디</th><th>이름</th><th>등급</th><th>관리</th></tr></thead>
                            <tbody id="adminTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 설정 -->
            <div class="panel" id="settingsPanel">
                <div class="form-box">
                    <h3>비밀번호 변경</h3>
                    <div class="form-group"><label>현재 비밀번호</label><input type="password" id="curPw"></div>
                    <div class="form-group"><label>새 비밀번호</label><input type="password" id="newPw"></div>
                    <div class="form-group"><label>새 비밀번호 확인</label><input type="password" id="newPw2"></div>
                    <button class="form-btn" id="changePwBtn">비밀번호 변경</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 상세 모달 -->
    <div class="modal" id="modal">
        <div class="modal-box">
            <div class="modal-head"><h3>신청 상세</h3><button class="modal-close" id="modalClose">✕</button></div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        var SUPABASE_URL = 'https://ohxnhqlcdisqsgicbbwt.supabase.co';
        var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oeG5ocWxjZGlzcXNnaWNiYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMDc0OTgsImV4cCI6MjA4Mzg4MzQ5OH0.R1IbWF0f_5bSFCCkSV_ZGJY9_PjwKYLC8ZW4GFW-Jv8';
        var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        var subs = [];
        var filter = 'all';
        var currentAdmin = null;

        function toast(m, t) {
            var el = document.getElementById('toast');
            el.textContent = m;
            el.className = 'toast show ' + (t || 'success');
            setTimeout(function() { el.className = 'toast'; }, 3000);
        }

        // 로그인
        document.getElementById('loginBtn').onclick = function() {
            var id = document.getElementById('adminId').value.trim();
            var pw = document.getElementById('adminPw').value;
            
            if (!id || !pw) {
                document.getElementById('loginError').textContent = '아이디와 비밀번호를 입력하세요';
                return;
            }
            
            sb.from('admins').select('*').eq('admin_id', id).eq('password', pw).single().then(function(res) {
                if (res.data) {
                    currentAdmin = res.data;
                    sessionStorage.setItem('adminData', JSON.stringify(res.data));
                    showDashboard();
                } else {
                    document.getElementById('loginError').textContent = '아이디 또는 비밀번호가 틀렸습니다';
                }
            }).catch(function() {
                document.getElementById('loginError').textContent = '로그인 실패';
            });
        };

        document.getElementById('adminPw').onkeypress = function(e) {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        };

        // 로그아웃
        document.getElementById('logoutBtn').onclick = function() {
            sessionStorage.removeItem('adminData');
            currentAdmin = null;
            location.reload();
        };

        // 세션 체크
        var saved = sessionStorage.getItem('adminData');
        if (saved) {
            currentAdmin = JSON.parse(saved);
            showDashboard();
        }

        function showDashboard() {
            document.getElementById('loginWrap').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('currentUser').textContent = currentAdmin.name || currentAdmin.admin_id;
            
            if (currentAdmin.role !== 'master') {
                document.getElementById('addAdminBox').style.display = 'none';
            }
            
            loadAll();
        }

        // 탭
        document.querySelectorAll('.tabs button').forEach(function(btn) {
            btn.onclick = function() {
                var tab = this.getAttribute('data-tab');
                document.querySelectorAll('.tabs button').forEach(function(b) { b.className = ''; });
                document.querySelectorAll('.panel').forEach(function(p) { p.className = 'panel'; });
                this.className = 'active';
                document.getElementById(tab + 'Panel').className = 'panel active';
            };
        });

        // 필터
        document.querySelectorAll('.filters button').forEach(function(btn) {
            btn.onclick = function() {
                filter = this.getAttribute('data-filter');
                document.querySelectorAll('.filters button').forEach(function(b) { b.className = ''; });
                this.className = 'active';
                renderSubs();
            };
        });

        function loadAll() {
            loadSubs();
            loadPopups();
            loadNotice();
            loadAdmins();
        }

        // 신청 관리
        function loadSubs() {
            sb.from('submissions').select('*').order('created_at', { ascending: false }).then(function(res) {
                subs = res.data || [];
                document.getElementById('sTotal').textContent = subs.length;
                document.getElementById('sNew').textContent = subs.filter(function(s) { return s.status === '신규'; }).length;
                document.getElementById('sProgress').textContent = subs.filter(function(s) { return s.status === '진행중'; }).length;
                document.getElementById('sDone').textContent = subs.filter(function(s) { return s.status === '완료'; }).length;
                renderSubs();
            });
        }

        function renderSubs() {
            var list = filter === 'all' ? subs : subs.filter(function(s) { return s.type === filter; });
            var tb = document.getElementById('subTable');
            if (!list.length) {
                tb.innerHTML = '<tr><td colspan="6"><div class="empty"><span>📭</span>신청 없음</div></td></tr>';
                return;
            }
            var html = '';
            list.forEach(function(s) {
                var tc = s.type === '협력사 신청' ? 'partner' : s.type === '라이더 신청' ? 'rider' : 'settlement';
                var sc = s.status === '신규' ? 'new' : s.status === '진행중' ? 'progress' : 'done';
                var tn = s.type ? s.type.replace(' 신청', '') : '-';
                var date = new Date(s.created_at).toLocaleDateString('ko-KR');
                html += '<tr>';
                html += '<td><span class="badge ' + tc + '">' + tn + '</span></td>';
                html += '<td>' + (s.name || '-') + '</td>';
                html += '<td>' + (s.phone || '-') + '</td>';
                html += '<td><span class="badge ' + sc + '">' + (s.status || '신규') + '</span></td>';
                html += '<td>' + date + '</td>';
                html += '<td><button class="btn btn-view" onclick="viewSub(' + s.id + ')">상세</button><button class="btn btn-del" onclick="delSub(' + s.id + ')">삭제</button></td>';
                html += '</tr>';
            });
            tb.innerHTML = html;
        }

        window.viewSub = function(id) {
            var s = subs.find(function(x) { return x.id === id; });
            if (!s) return;
            var h = '';
            h += '<div class="detail-row"><span>유형</span><span>' + (s.type || '-') + '</span></div>';
            h += '<div class="detail-row"><span>이름</span><span>' + (s.name || '-') + '</span></div>';
            h += '<div class="detail-row"><span>연락처</span><span>' + (s.phone || '-') + '</span></div>';
            if (s.type === '협력사 신청') {
                h += '<div class="detail-row"><span>사업자번호</span><span>' + (s.biz_num || '-') + '</span></div>';
                h += '<div class="detail-row"><span>희망지역</span><span>' + (s.region || '-') + '</span></div>';
            } else if (s.type === '라이더 신청') {
                h += '<div class="detail-row"><span>지역</span><span>' + (s.region || '-') + '</span></div>';
                h += '<div class="detail-row"><span>경력</span><span>' + (s.experience || '-') + '</span></div>';
                h += '<div class="detail-row"><span>시간대</span><span>' + (s.work_time || '-') + '</span></div>';
            } else if (s.type === '선정산 신청') {
                h += '<div class="detail-row"><span>상호</span><span>' + (s.company || '-') + '</span></div>';
                h += '<div class="detail-row"><span>구분</span><span>' + (s.settlement_type || '-') + '</span></div>';
                h += '<div class="detail-row"><span>플랫폼</span><span>' + (s.platform || '-') + '</span></div>';
            }
            h += '<div class="detail-row"><span>문의</span><span>' + (s.message || '-') + '</span></div>';
            h += '<div class="detail-row"><span>날짜</span><span>' + new Date(s.created_at).toLocaleString('ko-KR') + '</span></div>';
            h += '<div class="detail-row"><span>상태</span><span><select class="status-sel" onchange="updateSub(' + s.id + ',this.value)">';
            h += '<option value="신규"' + (s.status === '신규' ? ' selected' : '') + '>신규</option>';
            h += '<option value="진행중"' + (s.status === '진행중' ? ' selected' : '') + '>진행중</option>';
            h += '<option value="완료"' + (s.status === '완료' ? ' selected' : '') + '>완료</option>';
            h += '</select></span></div>';
            document.getElementById('modalBody').innerHTML = h;
            document.getElementById('modal').className = 'modal show';
        };

        window.updateSub = function(id, st) {
            sb.from('submissions').update({ status: st }).eq('id', id).then(function() {
                toast('상태 변경됨');
                loadSubs();
            });
        };

        window.delSub = function(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            sb.from('submissions').delete().eq('id', id).then(function() {
                toast('삭제됨');
                loadSubs();
            });
        };

        document.getElementById('modalClose').onclick = function() {
            document.getElementById('modal').className = 'modal';
        };
        document.getElementById('modal').onclick = function(e) {
            if (e.target === this) this.className = 'modal';
        };

        // 팝업 관리
        var uploadedImageUrl = '';
        
        // 이미지 업로드 박스 클릭
        document.getElementById('uploadBox').onclick = function(e) {
            if (e.target.id !== 'removeImg') {
                document.getElementById('pImageFile').click();
            }
        };
        
        // 드래그 앤 드롭
        var uploadBox = document.getElementById('uploadBox');
        uploadBox.ondragover = function(e) {
            e.preventDefault();
            this.classList.add('dragover');
        };
        uploadBox.ondragleave = function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
        };
        uploadBox.ondrop = function(e) {
            e.preventDefault();
            this.classList.remove('dragover');
            var files = e.dataTransfer.files;
            if (files.length > 0) {
                handleImageUpload(files[0]);
            }
        };
        
        // 파일 선택
        document.getElementById('pImageFile').onchange = function(e) {
            if (e.target.files.length > 0) {
                handleImageUpload(e.target.files[0]);
            }
        };
        
        // 이미지 삭제
        document.getElementById('removeImg').onclick = function(e) {
            e.stopPropagation();
            uploadedImageUrl = '';
            document.getElementById('pImg').value = '';
            document.getElementById('previewImg').style.display = 'none';
            document.getElementById('uploadPreview').style.display = 'block';
            document.getElementById('removeImg').style.display = 'none';
            document.getElementById('pImageFile').value = '';
        };
        
        async function handleImageUpload(file) {
            // 파일 크기 체크 (5MB)
            if (file.size > 5 * 1024 * 1024) {
                toast('파일 크기는 5MB 이하만 가능합니다', 'error');
                return;
            }
            
            // 이미지 파일 체크
            if (!file.type.startsWith('image/')) {
                toast('이미지 파일만 업로드 가능합니다', 'error');
                return;
            }
            
            // 미리보기 표시
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewImg').style.display = 'block';
                document.getElementById('uploadPreview').style.display = 'none';
                document.getElementById('removeImg').style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            // Supabase Storage에 업로드
            toast('이미지 업로드 중...');
            
            var fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
            
            try {
                var result = await sb.storage.from('popups').upload(fileName, file, {
                    cacheControl: '3600',
                    upsert: false
                });
                
                if (result.error) {
                    console.log('업로드 에러:', result.error);
                    toast('업로드 실패: ' + result.error.message, 'error');
                    return;
                }
                
                // 공개 URL 가져오기
                var urlResult = sb.storage.from('popups').getPublicUrl(fileName);
                uploadedImageUrl = urlResult.data.publicUrl;
                document.getElementById('pImg').value = uploadedImageUrl;
                
                toast('이미지 업로드 완료!');
                console.log('업로드된 URL:', uploadedImageUrl);
            } catch(e) {
                console.log('업로드 예외:', e);
                toast('업로드 실패', 'error');
            }
        }

        function loadPopups() {
            sb.from('popups').select('*').order('id', { ascending: false }).then(function(res) {
                var list = res.data || [];
                var tb = document.getElementById('popupTable');
                if (!list.length) {
                    tb.innerHTML = '<tr><td colspan="4"><div class="empty"><span>🎈</span>팝업 없음</div></td></tr>';
                    return;
                }
                var html = '';
                list.forEach(function(p) {
                    html += '<tr>';
                    html += '<td>';
                    if (p.image_url) {
                        html += '<img src="' + p.image_url + '" class="thumb-img">';
                    } else {
                        html += '<span style="font-size:1.5rem">' + (p.icon || '📢') + '</span>';
                    }
                    html += '</td>';
                    html += '<td>' + p.title + '</td>';
                    html += '<td><span class="badge ' + (p.active ? 'new' : 'done') + '">' + (p.active ? '활성' : '비활성') + '</span></td>';
                    html += '<td><button class="btn btn-view" onclick="togglePopup(' + p.id + ',' + !p.active + ')">' + (p.active ? '비활성화' : '활성화') + '</button><button class="btn btn-del" onclick="delPopup(' + p.id + ')">삭제</button></td>';
                    html += '</tr>';
                });
                tb.innerHTML = html;
            });
        }

        document.getElementById('savePopupBtn').onclick = function() {
            var title = document.getElementById('pTitle').value.trim();
            if (!title) { toast('제목을 입력하세요', 'error'); return; }
            
            var imageUrl = document.getElementById('pImg').value || uploadedImageUrl;
            
            sb.from('popups').insert([{
                title: title,
                icon: document.getElementById('pIcon').value.trim() || '📢',
                image_url: imageUrl,
                description: document.getElementById('pDesc').value.trim(),
                btn_text: document.getElementById('pBtnTxt').value.trim() || '자세히보기',
                btn_link: document.getElementById('pBtnLink').value.trim() || '#contact',
                active: document.getElementById('pActive').value === 'true'
            }]).then(function() {
                toast('팝업 추가됨');
                // 폼 초기화
                document.getElementById('pTitle').value = '';
                document.getElementById('pIcon').value = '';
                document.getElementById('pImg').value = '';
                document.getElementById('pDesc').value = '';
                document.getElementById('pBtnTxt').value = '';
                document.getElementById('pBtnLink').value = '';
                // 이미지 업로드 초기화
                uploadedImageUrl = '';
                document.getElementById('previewImg').style.display = 'none';
                document.getElementById('uploadPreview').style.display = 'block';
                document.getElementById('removeImg').style.display = 'none';
                document.getElementById('pImageFile').value = '';
                loadPopups();
            });
        };

        window.togglePopup = function(id, active) {
            sb.from('popups').update({ active: active }).eq('id', id).then(function() {
                toast('상태 변경됨');
                loadPopups();
            });
        };

        window.delPopup = function(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            sb.from('popups').delete().eq('id', id).then(function() {
                toast('삭제됨');
                loadPopups();
            });
        };

        // 공지 관리
        function loadNotice() {
            sb.from('notice').select('*').limit(1).maybeSingle().then(function(res) {
                if (res.data) {
                    document.getElementById('nText').value = res.data.text || '';
                    document.getElementById('nColor').value = res.data.color || 'mint';
                    document.getElementById('nShow').value = res.data.show ? 'true' : 'false';
                }
            });
        }

        document.getElementById('saveNoticeBtn').onclick = function() {
            sb.from('notice').delete().neq('id', 0).then(function() {
                sb.from('notice').insert([{
                    text: document.getElementById('nText').value,
                    color: document.getElementById('nColor').value,
                    show: document.getElementById('nShow').value === 'true'
                }]).then(function() {
                    toast('공지 저장됨');
                });
            });
        };

        // 관리자 관리
        function loadAdmins() {
            sb.from('admins').select('*').order('id', { ascending: true }).then(function(res) {
                var list = res.data || [];
                var tb = document.getElementById('adminTable');
                if (!list.length) {
                    tb.innerHTML = '<tr><td colspan="4"><div class="empty"><span>👤</span>관리자 없음</div></td></tr>';
                    return;
                }
                var html = '';
                list.forEach(function(a) {
                    html += '<tr>';
                    html += '<td>' + a.admin_id + '</td>';
                    html += '<td>' + (a.name || '-') + '</td>';
                    html += '<td><span class="badge ' + a.role + '">' + (a.role === 'master' ? '마스터' : '관리자') + '</span></td>';
                    html += '<td>';
                    if (currentAdmin.role === 'master' && a.admin_id !== currentAdmin.admin_id) {
                        html += '<button class="btn btn-del" onclick="delAdmin(' + a.id + ')">삭제</button>';
                    }
                    html += '</td>';
                    html += '</tr>';
                });
                tb.innerHTML = html;
            });
        }

        document.getElementById('addAdminBtn').onclick = function() {
            var id = document.getElementById('newAdminId').value.trim();
            var pw = document.getElementById('newAdminPw').value;
            var name = document.getElementById('newAdminName').value.trim();
            var role = document.getElementById('newAdminRole').value;
            
            if (!id || !pw) { toast('아이디와 비밀번호를 입력하세요', 'error'); return; }
            
            sb.from('admins').insert([{
                admin_id: id,
                password: pw,
                name: name || id,
                role: role
            }]).then(function(res) {
                if (res.error) {
                    toast('추가 실패: 중복된 아이디', 'error');
                } else {
                    toast('관리자 추가됨');
                    document.getElementById('newAdminId').value = '';
                    document.getElementById('newAdminPw').value = '';
                    document.getElementById('newAdminName').value = '';
                    loadAdmins();
                }
            });
        };

        window.delAdmin = function(id) {
            if (!confirm('이 관리자를 삭제하시겠습니까?')) return;
            sb.from('admins').delete().eq('id', id).then(function() {
                toast('관리자 삭제됨');
                loadAdmins();
            });
        };

        // 비밀번호 변경
        document.getElementById('changePwBtn').onclick = function() {
            var curPw = document.getElementById('curPw').value;
            var newPw = document.getElementById('newPw').value;
            var newPw2 = document.getElementById('newPw2').value;
            
            if (!curPw || !newPw || !newPw2) {
                toast('모든 항목을 입력하세요', 'error');
                return;
            }
            
            if (newPw !== newPw2) {
                toast('새 비밀번호가 일치하지 않습니다', 'error');
                return;
            }
            
            if (curPw !== currentAdmin.password) {
                toast('현재 비밀번호가 틀렸습니다', 'error');
                return;
            }
            
            sb.from('admins').update({ password: newPw }).eq('id', currentAdmin.id).then(function() {
                toast('비밀번호 변경됨');
                currentAdmin.password = newPw;
                sessionStorage.setItem('adminData', JSON.stringify(currentAdmin));
                document.getElementById('curPw').value = '';
                document.getElementById('newPw').value = '';
                document.getElementById('newPw2').value = '';
            });
        };
    </script>
</body>
</html>
