락처</th>
                                <th>지역</th>
                                <th>상태</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="submissionsList"></tbody>
                    </table>
                </div>
            </div>

            <!-- 팝업 관리 -->
            <div class="tab-section" id="tab-popups">
                <div class="page-header">
                    <h1>🎯 팝업 관리</h1>
                    <p>홈페이지 팝업을 설정합니다 (이미지 업로드 가능)</p>
                </div>

                <div class="settings-card">
                    <h3><span class="icon">📝</span> 현재 팝업 목록</h3>
                    <div class="popup-list" id="popupList"></div>
                </div>

                <div class="settings-card">
                    <h3><span class="icon">➕</span> 새 팝업 추가</h3>
                    
                    <div class="form-group">
                        <label>팝업 이미지 (권장: 480x250px)</label>
                        <div class="image-upload" id="imageUpload" onclick="document.getElementById('popupImageInput').click()">
                            <div class="upload-placeholder">
                                <span class="icon">📷</span>
                                <p>클릭하여 이미지 업로드</p>
                                <small style="color:var(--gray-500)">JPG, PNG, GIF (최대 2MB)</small>
                            </div>
                            <input type="file" id="popupImageInput" accept="image/*" onchange="handleImageUpload(this)">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>팝업 제목 *</label>
                            <input type="text" id="newPopupTitle" placeholder="ex) 협력사 대모집!">
                        </div>
                        <div class="form-group">
                            <label>아이콘 (이미지 없을 때 표시)</label>
                            <input type="text" id="newPopupIcon" placeholder="🚀">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>팝업 내용 *</label>
                        <textarea id="newPopupDesc" placeholder="팝업에 표시될 내용을 입력하세요"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>버튼 텍스트</label>
                            <input type="text" id="newPopupBtn" placeholder="신청하기 →">
                        </div>
                        <div class="form-group">
                            <label>버튼 링크</label>
                            <input type="text" id="newPopupLink" placeholder="#contact">
                        </div>
                    </div>
                    <button class="save-btn" onclick="addPopup()">팝업 추가하기</button>
                </div>
            </div>

            <!-- 공지 설정 -->
            <div class="tab-section" id="tab-notice">
                <div class="page-header">
                    <h1>📢 공지 설정</h1>
                    <p>상단 공지 배너를 설정합니다</p>
                </div>

                <div class="settings-card">
                    <h3><span class="icon">📢</span> 공지 배너 설정</h3>
                    <div class="form-group">
                        <label>공지 내용</label>
                        <input type="text" id="noticeText" placeholder="📢 전국 협력사 대모집! 지금 바로 신청하세요!">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>배너 표시</label>
                            <select id="noticeShow">
                                <option value="true">표시</option>
                                <option value="false">숨김</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>배너 색상</label>
                            <select id="noticeColor">
                                <option value="mint">민트</option>
                                <option value="orange">오렌지</option>
                                <option value="red">빨강</option>
                            </select>
                        </div>
                    </div>
                    <button class="save-btn" onclick="saveNotice()">저장하기</button>
                </div>
            </div>

            <!-- 기본 설정 -->
            <div class="tab-section" id="tab-settings">
                <div class="page-header">
                    <h1>⚙️ 기본 설정</h1>
                    <p>사이트 기본 정보를 설정합니다</p>
                </div>

                <div class="settings-card">
                    <h3><span class="icon">📞</span> 연락처 정보</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>대표 전화번호</label>
                            <input type="text" id="settingPhone" value="1660-3543">
                        </div>
                        <div class="form-group">
                            <label>이메일</label>
                            <input type="text" id="settingEmail" value="pro_5211@naver.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>카카오톡 채널 URL</label>
                        <input type="text" id="settingKakao" placeholder="https://pf.kakao.com/_xxxxx">
                    </div>
                    <div class="form-group">
                        <label>운영 시간</label>
                        <input type="text" id="settingHours" value="09:00 ~ 익일 08:00">
                    </div>
                    <button class="save-btn" onclick="saveSettings()">저장하기</button>
                </div>

                <div class="settings-card">
                    <h3><span class="icon">🔐</span> 관리자 비밀번호 변경</h3>
                    <div class="form-group">
                        <label>새 비밀번호</label>
                        <input type="password" id="newPassword" placeholder="새 비밀번호 입력">
                    </div>
                    <div class="form-group">
                        <label>비밀번호 확인</label>
                        <input type="password" id="confirmPassword" placeholder="비밀번호 확인">
                    </div>
                    <button class="save-btn" onclick="changePassword()">비밀번호 변경</button>
                </div>

                <div class="settings-card">
                    <h3><span class="icon">🗑️</span> 데이터 관리</h3>
                    <p style="color:var(--gray-400);margin-bottom:16px">주의: 아래 버튼을 누르면 데이터가 삭제됩니다.</p>
                    <button class="save-btn" style="background:var(--red)" onclick="clearAllData()">모든 데이터 초기화</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 상세보기 모달 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>신청 상세</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modalContent"></div>
            <div class="modal-footer">
                <button class="action-btn" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 초기 데이터 =====
        const DEFAULT_PASSWORD = 'teambro2025';
        let uploadedImage = null;

        // ===== 토스트 알림 =====
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ===== 로그인 =====
        function login() {
            const password = document.getElementById('adminPassword').value;
            const savedPassword = localStorage.getItem('adminPassword') || DEFAULT_PASSWORD;
            
            if (password === savedPassword) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminLayout').classList.add('active');
                loadDashboard();
                showToast('로그인 성공!');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminLayout').classList.remove('active');
            document.getElementById('adminPassword').value = '';
            showToast('로그아웃 되었습니다.');
        }

        // ===== 탭 전환 =====
        function showTab(tabName, element) {
            document.querySelectorAll('.tab-section').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.sidebar-menu a').forEach(link => link.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            if (element) element.classList.add('active');
            
            if (tabName === 'dashboard') loadDashboard();
            if (tabName === 'submissions') loadSubmissions();
            if (tabName === 'popups') loadPopups();
        }

        // ===== 대시보드 =====
        function loadDashboard() {
            const submissions = JSON.parse(localStorage.getItem('teambroSubmissions') || '[]');
            
            const total = submissions.length;
            const newCount = submissions.filter(s => s.status === '신규').length;
            const progressCount = submissions.filter(s => s.status === '진행중').length;
            const doneCount = submissions.filter(s => s.status === '완료').length;
            
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statNew').textContent = newCount;
            document.getElementById('statProgress').textContent = progressCount;
            document.getElementById('statDone').textContent = doneCount;
            
            const recent = submissions.slice(0, 5);
            const tbody = document.getElementById('recentSubmissions');
            
            if (recent.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--gray-500);padding:40px">신청 내역이 없습니다</td></tr>';
            } else {
                tbody.innerHTML = recent.map(s => `
                    <tr>
                        <td>${s.date}</td>
                        <td>${s.type}</td>
                        <td>${s.name}</td>
                        <td>${s.phone}</td>
                        <td><span class="status-badge ${s.status === '신규' ? 'new' : s.status === '진행중' ? 'progress' : 'done'}">${s.status}</span></td>
                    </tr>
                `).join('');
            }
        }

        // ===== 신청 목록 =====
        function loadSubmissions() {
            const submissions = JSON.parse(localStorage.getItem('teambroSubmissions') || '[]');
            renderSubmissions(submissions);
        }

        function renderSubmissions(submissions) {
            const tbody = document.getElementById('submissionsList');
            
            if (submissions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--gray-500);padding:40px">신청 내역이 없습니다</td></tr>';
            } else {
                tbody.innerHTML = submissions.map(s => `
                    <tr>
                        <td>${s.date}</td>
                        <td>${s.type}</td>
                        <td>${s.name}</td>
                        <td>${s.phone}</td>
                        <td>${s.region || '-'}</td>
                        <td>
                            <select onchange="updateStatus(${s.id}, this.value)" style="padding:4px 8px;background:var(--bg);border:1px solid var(--card-border);border-radius:4px;color:#fff;font-size:.8rem">
                                <option value="신규" ${s.status === '신규' ? 'selected' : ''}>신규</option>
                                <option value="진행중" ${s.status === '진행중' ? 'selected' : ''}>진행중</option>
                                <option value="완료" ${s.status === '완료' ? 'selected' : ''}>완료</option>
                            </select>
                        </td>
                        <td>
                            <button class="action-btn" onclick="viewDetail(${s.id})">상세</button>
                            <button class="action-btn delete" onclick="deleteSubmission(${s.id})">삭제</button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        function filterSubmissions() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('filterType').value;
            const statusFilter = document.getElementById('filterStatus').value;
            
            let submissions = JSON.parse(localStorage.getItem('teambroSubmissions') || '[]');
            
            if (search) {
                submissions = submissions.filter(s => 
                    s.name.toLowerCase().includes(search) || 
                    s.phone.includes(search)
                );
            }
            if (typeFilter) {
                submissions = submissions.filter(s => s.type === typeFilter);
            }
            if (statusFilter) {
                submissions = submissions.filter(s => s.status === statusFilter);
            }
            
            renderSubmissions(submissions);
        }

        function updateStatus(id, status) {
            let submissions = JSON.parse(localStorage.getItem('teambroSubmissions') || '[]');
            submissions = submissions.map(s => s.id === id ? {...s, status} : s);
            localStorage.setItem('teambroSubmissions', JSON.stringify(submissions));
            showToast('상태가 변경되었습니다.');
        }

        function viewDetail(id) {
            const submissions = JSON.parse(localStorage.getItem('teambroSubmissions') || '[]');
            const s = submissions.find(sub => sub.id === id);
            
            if (s) {
                document.getElementById('modalContent').innerHTML = `
                    <div class="form-group"><label>날짜</label><input type="text" value="${s.date}" readonly></div>
                    <div class="form-group"><label>유형</label><input type="text" value="${s.type}" readonly></div>
                    <div class="form-group"><label>이름/상호</label><input type="text" value="${s.name}" readonly></div>
                    <div class="form-group"><label>연락처</label><input type="text" value="${s.phone}" readonly></div>
                    <div class="form-group"><label>사업자번호</label><input type="text" value="${s.bizNum || '-'}" readonly></div>
                    <div class="form-group"><label>희망지역</label><input type="text" value="${s.region || '-'}" readonly></div>
                    <div class="form-group"><label>문의내용</label><textarea readonly>${s.message || '-'}</textarea></div>
                `;
                document.getElementById('detailModal').classList.add('show');
            }
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        function deleteSubmission(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                let submissions = JSON.parse(localStorage.getItem('teambroSubmissions') || '[]');
                submissions = submissions.filter(s => s.id !== id);
                localStorage.setItem('teambroSubmissions', JSON.stringify(submissions));
                loadSubmissions();
                showToast('삭제되었습니다.');
            }
        }

        // ===== 이미지 업로드 =====
        function handleImageUpload(input) {
            const file = input.files[0];
            if (!file) return;
            
            if (file.size > 2 * 1024 * 1024) {
                showToast('이미지 크기는 2MB 이하여야 합니다.', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImage = e.target.result;
                const uploadDiv = document.getElementById('imageUpload');
                uploadDiv.classList.add('has-image');
                uploadDiv.innerHTML = `
                    <img src="${uploadedImage}" alt="미리보기">
                    <button class="remove-image" onclick="removeImage(event)">✕</button>
                    <input type="file" id="popupImageInput" accept="image/*" onchange="handleImageUpload(this)">
                `;
            };
            reader.readAsDataURL(file);
        }

        function removeImage(event) {
            event.stopPropagation();
            uploadedImage = null;
            const uploadDiv = document.getElementById('imageUpload');
            uploadDiv.classList.remove('has-image');
            uploadDiv.innerHTML = `
                <div class="upload-placeholder">
                    <span class="icon">📷</span>
                    <p>클릭하여 이미지 업로드</p>
                    <small style="color:var(--gray-500)">JPG, PNG, GIF (최대 2MB)</small>
                </div>
                <input type="file" id="popupImageInput" accept="image/*" onchange="handleImageUpload(this)">
            `;
        }

        // ===== 팝업 관리 =====
        function loadPopups() {
            let popups = JSON.parse(localStorage.getItem('teambroPopups') || '[]');
            const list = document.getElementById('popupList');
            
            if (popups.length === 0) {
                list.innerHTML = '<p style="color:var(--gray-500);text-align:center;padding:24px">등록된 팝업이 없습니다</p>';
                return;
            }
            
            list.innerHTML = popups.map(p => `
                <div class="popup-item ${p.active ? 'active-popup' : ''}">
                    <div class="popup-preview">
                        ${p.image ? `<img src="${p.image}" alt="${p.title}">` : p.icon || '📢'}
                    </div>
                    <div class="popup-info">
                        <h4>${p.title}</h4>
                        <p>${p.desc}</p>
                    </div>
                    <div class="popup-toggle">
                        <div class="toggle-switch ${p.active ? 'on' : ''}" onclick="togglePopup(${p.id})"></div>
                        <button class="action-btn delete" onclick="deletePopup(${p.id})">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        function togglePopup(id) {
            let popups = JSON.parse(localStorage.getItem('teambroPopups') || '[]');
            popups = popups.map(p => p.id === id ? {...p, active: !p.active} : p);
            localStorage.setItem('teambroPopups', JSON.stringify(popups));
            loadPopups();
            showToast('팝업 상태가 변경되었습니다.');
        }

        function addPopup() {
            const title = document.getElementById('newPopupTitle').value.trim();
            const icon = document.getElementById('newPopupIcon').value.trim() || '📢';
            const desc = document.getElementById('newPopupDesc').value.trim();
            const btn = document.getElementById('newPopupBtn').value.trim() || '자세히 보기 →';
            const link = document.getElementById('newPopupLink').value.trim() || '#contact';
            
            if (!title || !desc) {
                showToast('제목과 내용을 입력해주세요.', 'error');
                return;
            }
            
            let popups = JSON.parse(localStorage.getItem('teambroPopups') || '[]');
            popups.push({
                id: Date.now(),
                title, 
                icon, 
                desc, 
                btn, 
                link,
                image: uploadedImage,
                active: true
            });
            localStorage.setItem('teambroPopups', JSON.stringify(popups));
            
            // 입력 초기화
            document.getElementById('newPopupTitle').value = '';
            document.getElementById('newPopupIcon').value = '';
            document.getElementById('newPopupDesc').value = '';
            document.getElementById('newPopupBtn').value = '';
            document.getElementById('newPopupLink').value = '';
            removeImage(new Event('click'));
            
            loadPopups();
            showToast('팝업이 추가되었습니다!');
        }

        function deletePopup(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                let popups = JSON.parse(localStorage.getItem('teambroPopups') || '[]');
                popups = popups.filter(p => p.id !== id);
                localStorage.setItem('teambroPopups', JSON.stringify(popups));
                loadPopups();
                showToast('팝업이 삭제되었습니다.');
            }
        }

        // ===== 공지 설정 =====
        function saveNotice() {
            const notice = {
                text: document.getElementById('noticeText').value,
                show: document.getElementById('noticeShow').value === 'true',
                color: document.getElementById('noticeColor').value
            };
            localStorage.setItem('teambroNotice', JSON.stringify(notice));
            showToast('공지 설정이 저장되었습니다!');
        }

        // ===== 기본 설정 =====
        function saveSettings() {
            const settings = {
                phone: document.getElementById('settingPhone').value,
                email: document.getElementById('settingEmail').value,
                kakao: document.getElementById('settingKakao').value,
                hours: document.getElementById('settingHours').value
            };
            localStorage.setItem('teambroSettings', JSON.stringify(settings));
            showToast('설정이 저장되었습니다!');
        }

        function changePassword() {
            const newPw = document.getElementById('newPassword').value;
            const confirmPw = document.getElementById('confirmPassword').value;
            
            if (!newPw || newPw.length < 4) {
                showToast('비밀번호는 4자 이상이어야 합니다.', 'error');
                return;
            }
            if (newPw !== confirmPw) {
                showToast('비밀번호가 일치하지 않습니다.', 'error');
                return;
            }
            
            localStorage.setItem('adminPassword', newPw);
            showToast('비밀번호가 변경되었습니다!');
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        function clearAllData() {
            if (confirm('정말 모든 데이터를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) {
                localStorage.removeItem('teambroSubmissions');
                localStorage.removeItem('teambroPopups');
                localStorage.removeItem('teambroNotice');
                localStorage.removeItem('teambroSettings');
                showToast('모든 데이터가 초기화되었습니다.');
                loadDashboard();
            }
        }

        // ===== 초기 로드 =====
        window.addEventListener('load', () => {
            // 저장된 설정 불러오기
            const notice = JSON.parse(localStorage.getItem('teambroNotice') || '{}');
            if (notice.text) document.getElementById('noticeText').value = notice.text;
            if (notice.show !== undefined) document.getElementById('noticeShow').value = notice.show.toString();
            if (notice.color) document.getElementById('noticeColor').value = notice.color;
            
            const settings = JSON.parse(localStorage.getItem('teambroSettings') || '{}');
            if (settings.phone) document.getElementById('settingPhone').value = settings.phone;
            if (settings.email) document.getElementById('settingEmail').value = settings.email;
            if (settings.kakao) document.getElementById('settingKakao').value = settings.kakao;
            if (settings.hours) document.getElementById('settingHours').value = settings.hours;
        });
    </script>
</body>
</html>
