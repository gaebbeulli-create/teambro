<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지 | TEAM BRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .popup-wrap{width:100%;max-width:500px}
        .popup-card{background:#16161f;border:2px solid #2dd4bf;border-radius:20px;overflow:hidden;margin-bottom:20px}
        .popup-img{width:100%;height:250px;background:#12121a;display:flex;align-items:center;justify-content:center}
        .popup-img img{width:100%;height:100%;object-fit:cover}
        .popup-img .no-img{font-size:4rem}
        .popup-body{padding:24px}
        .popup-title{font-size:1.5rem;margin-bottom:12px;color:#2dd4bf}
        .popup-desc{color:#b0b0c0;line-height:1.7;margin-bottom:20px}
        .popup-btn{display:inline-block;background:#2dd4bf;color:#000;padding:12px 24px;border-radius:50px;text-decoration:none;font-weight:bold}
        .popup-btn:hover{background:#5eead4}
        .close-btn{display:block;text-align:center;color:#808090;text-decoration:none;padding:12px}
        .close-btn:hover{color:#fff}
        .nav-dots{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
        .dot{width:10px;height:10px;border-radius:50%;background:#252530;border:none;cursor:pointer}
        .dot.active{background:#2dd4bf}
        .nav-arrows{display:flex;justify-content:space-between;margin-bottom:20px}
        .arrow{background:#16161f;border:2px solid #252530;border-radius:10px;color:#fff;padding:10px 20px;cursor:pointer;font-size:1rem}
        .arrow:hover{border-color:#2dd4bf}
        .arrow:disabled{opacity:.3;cursor:not-allowed}
        .empty{text-align:center;padding:60px;color:#808090}
        .empty span{font-size:3rem;display:block;margin-bottom:16px}
    </style>
</head>
<body>
    <div class="popup-wrap">
        <div id="popupContent"></div>
        <a href="index.html" class="close-btn">닫기</a>
    </div>

    <script>
        var SUPABASE_URL = 'https://ohxnhqlcdisqsgicbbwt.supabase.co';
        var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oeG5ocWxjZGlzcXNnaWNiYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMDc0OTgsImV4cCI6MjA4Mzg4MzQ5OH0.R1IbWF0f_5bSFCCkSV_ZGJY9_PjwKYLC8ZW4GFW-Jv8';
        var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        var popups = [];
        var currentIndex = 0;

        sb.from('popups').select('*').eq('active', true).order('id', { ascending: false }).then(function(res) {
            popups = res.data || [];
            if (popups.length === 0) {
                document.getElementById('popupContent').innerHTML = '<div class="empty"><span>📭</span>등록된 공지가 없습니다</div>';
                return;
            }
            renderPopup();
        });

        function renderPopup() {
            var p = popups[currentIndex];
            var html = '';
            
            if (popups.length > 1) {
                html += '<div class="nav-arrows">';
                html += '<button class="arrow" onclick="prev()"' + (currentIndex === 0 ? ' disabled' : '') + '>← 이전</button>';
                html += '<button class="arrow" onclick="next()"' + (currentIndex === popups.length - 1 ? ' disabled' : '') + '>다음 →</button>';
                html += '</div>';
                
                html += '<div class="nav-dots">';
                for (var i = 0; i < popups.length; i++) {
                    html += '<button class="dot' + (i === currentIndex ? ' active' : '') + '" onclick="goTo(' + i + ')"></button>';
                }
                html += '</div>';
            }
            
            html += '<div class="popup-card">';
            html += '<div class="popup-img">';
            if (p.image_url) {
                html += '<img src="' + p.image_url + '" alt="' + p.title + '">';
            } else {
                html += '<span class="no-img">' + (p.icon || '📢') + '</span>';
            }
            html += '</div>';
            html += '<div class="popup-body">';
            html += '<h2 class="popup-title">' + p.title + '</h2>';
            html += '<p class="popup-desc">' + (p.description || '') + '</p>';
            if (p.btn_link) {
                html += '<a href="' + p.btn_link + '" class="popup-btn">' + (p.btn_text || '자세히 보기') + '</a>';
            }
            html += '</div>';
            html += '</div>';
            
            document.getElementById('popupContent').innerHTML = html;
        }

        window.prev = function() {
            if (currentIndex > 0) {
                currentIndex--;
                renderPopup();
            }
        };

        window.next = function() {
            if (currentIndex < popups.length - 1) {
                currentIndex++;
                renderPopup();
            }
        };

        window.goTo = function(i) {
            currentIndex = i;
            renderPopup();
        };
    </script>
</body>
</html>
